name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Guard against a scaffold that has only Dart files. Build the android/
      # folder inside a throwaway project and copy just that folder in, so our
      # own lib/ and pubspec.yaml can never be overwritten.
      - name: Generate android folder if missing
        run: |
          if [ ! -d "android" ]; then
            TMP="$(mktemp -d)"
            flutter create "$TMP/seed" --platforms=android --project-name aeropulse_horizon_drift
            cp -r "$TMP/seed/android" ./android
            rm -rf "$TMP"
          fi

      # Launcher icon + splash screen come from branding/*.png, generated here
      # because android/ is not committed.
      - name: Apply launcher icon and splash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tool/apply_branding.py

      # url_launcher needs these intents declared so canLaunchUrl() works on
      # Android 11+ (WhatsApp, dialer, browser, email).
      - name: Ensure Android intent queries (url_launcher)
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if p.exists():
              s = p.read_text()
              if "<queries>" not in s:
                  queries = (
                      '    <queries>\n'
                      '        <intent><action android:name="android.intent.action.VIEW" />'
                      '<data android:scheme="https" /></intent>\n'
                      '        <intent><action android:name="android.intent.action.VIEW" />'
                      '<data android:scheme="whatsapp" /></intent>\n'
                      '        <intent><action android:name="android.intent.action.DIAL" />'
                      '<data android:scheme="tel" /></intent>\n'
                      '        <intent><action android:name="android.intent.action.SENDTO" />'
                      '<data android:scheme="mailto" /></intent>\n'
                      '    </queries>\n'
                  )
                  s = s.replace("</manifest>", queries + "</manifest>")
                  p.write_text(s)
          PY

      # Give the app a repo-specific applicationId / namespace.
      #
      # NOTE: we deliberately DO NOT touch compileSdk here. The Flutter
      # template already sets `compileSdk = flutter.compileSdkVersion`, which is
      # 36 on current stable, and the plugins (url_launcher_android, androidx
      # browser/core) compile against that same value. Pinning it to a lower
      # number is exactly what makes the "AAR metadata" check fail.
      - name: Configure Android project
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          repo = os.environ.get("GITHUB_REPOSITORY", "app")
          app_id = "com.example." + repo.split("/")[-1]

          for name in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()

              text = re.sub(
                  r'(applicationId[ \t]*=?[ \t]*)"[^"]*"',
                  lambda m: m.group(1) + '"' + app_id + '"',
                  text,
              )
              text = re.sub(
                  r'(namespace[ \t]*=?[ \t]*)"[^"]*"',
                  lambda m: m.group(1) + '"' + app_id + '"',
                  text,
              )

              path.write_text(text)
              print("configured", name, "->", app_id)

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              m = manifest.read_text()
              m = re.sub(r'android:label="[^"]*"', 'android:label="AeroPulse"', m)
              manifest.write_text(m)
              print("labelled the app as AeroPulse")
          PY

      # The game is landscape-only. Lock the activity so the very first frame
      # is already landscape (the runtime lock in main.dart keeps it that way).
      - name: Lock activity to landscape
        run: |
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              m = manifest.read_text()
              m = re.sub(r'(<activity[^>]*android:name="\.MainActivity"[^>]*)', r'\1 android:screenOrientation="landscape"', m)
              manifest.write_text(m)
              print("landscape lock applied")
          PY

      # Print the resolved SDK versions so a future failure is easy to read.
      - name: Show Android SDK configuration
        run: |
          grep -rnE "compileSdk|targetSdk|minSdk|ndkVersion" android/app/build.gradle* || true

      # R8 keep rules (minification itself is skipped via --no-shrink).
      - name: Gradle fixes (R8 rules)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.android.play.core.**
          -dontwarn io.flutter.**
          -keep class io.flutter.** { *; }
          -keep class com.google.android.play.core.** { *; }
          EOF

      - name: Install dependencies
        run: flutter pub get

      # --no-shrink skips R8 minification, the biggest cause of release build failures.
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # When the user asks for the APK (manual run) or a version tag is pushed,
      # attach the APK to a GitHub Release so it is downloadable as a proper release.
      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'apk-latest' }}
          name: APK build
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: build/app/outputs/flutter-apk/app-release.apk
