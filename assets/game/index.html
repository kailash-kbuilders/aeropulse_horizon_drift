<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroPulse: Horizon Drift</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden; background: #05070d;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #7fe7ff; background: #05070d; z-index: 5;
      font: 600 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .22em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="boot">Loading Horizon</div>
  <script src="env_data.js"></script>
  <script src="three.min.js"></script>
  <script src="cannon.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
