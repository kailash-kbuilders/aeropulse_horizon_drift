name: aeropulse_horizon_drift
description: "AeroPulse: Horizon Drift — a 3D arcade racing game. Flutter UI (garage, HUD, controls) with a Three.js + Cannon.js physics scene inside a WebView."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/
